# Alembic configuration for the support-agent Postgres schema (spec 6.2).
# The sqlalchemy.url is intentionally left as a placeholder — env.py reads
# DATABASE_URL from the application settings at runtime so that the same
# config works for dev, CI, and production without editing this file.

[alembic]
# Path to migration scripts relative to this config file.
script_location = db/migrations

# Template used to generate migration filenames.
# The default is {rev}_{slug}.py; we keep it for readability.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Truncate slugs to this many characters in filenames.
truncate_slug_length = 40

# Set to 'true' to run the environment during ``offline`` mode.
# target_metadata is configured in env.py.
# sqlalchemy.url is overridden in env.py from DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
