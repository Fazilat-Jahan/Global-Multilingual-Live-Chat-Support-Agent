[project]
name = "global-multilingual-live-chat-support-agent"
version = "0.1.0"
description = "Production-grade MVP of an embeddable, multilingual, multi-agent AI customer support system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "openai-agents>=0.0.19",
    "openai>=1.50.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "redis>=5.0.8",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
