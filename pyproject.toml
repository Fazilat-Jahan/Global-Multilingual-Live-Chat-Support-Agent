[project]
name = "global-multilingual-live-chat-support-agent"
version = "0.1.0"
description = "Production-grade MVP of an embeddable, multilingual, multi-agent AI customer support system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "openai-agents>=0.0.19",
    "openai>=1.50.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "redis>=5.0.8",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "langdetect>=1.0.9",
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "websockets>=13.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# backend.db.connection.engine is a module-level singleton whose asyncpg
# connection pool is bound to whichever event loop created it — pytest-asyncio's
# default per-test event loop would make later tests reuse pooled connections
# from a closed loop ("Future attached to a different loop"). Sharing one
# session-scoped loop across the whole run avoids that.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Intentional str+Enum multiple inheritance (ConversationStatus, TicketStatus)
# for direct JSON/DB serialization compatibility — not a stylistic accident.
ignore = ["UP042"]

# Phase 18 (spec 22.1): coverage configuration.
# - Guardrail tests are included alongside unit tests because they exercise
#   the same guardrail modules with pure pattern-matching logic (no LLM).
# - Modules excluded below fundamentally require live external services
#   (Postgres, Redis, Qdrant, Gemini LLM) and are covered by the separate
#   integration/agent test suites which run without a coverage gate.
[tool.coverage.run]
source = ["backend"]
omit = [
    # Live LLM agents — every call hits Gemini API
    "backend/agents/*",
    # RAG modules requiring Qdrant + Gemini embedding API
    "backend/rag/retrieval.py",
    "backend/rag/embeddings.py",
    "backend/rag/ingestion.py",
    # Guardrail runner orchestrates LLM calls
    "backend/guardrails/runner.py",
    # Services requiring live Redis/Postgres/LLM
    "backend/services/conversation_service.py",
    "backend/services/escalation_service.py",
    "backend/services/session_service.py",
    # Model provider — Gemini API connection
    "backend/model_provider.py",
    # API endpoints requiring all live services
    "backend/api/health.py",
    "backend/api/tickets.py",
    "backend/tools/knowledge_search.py",
    # DB layer — migrations are Alembic internals; repository needs live Postgres
    "backend/db/connection.py",
    "backend/db/repository.py",
    "backend/db/migrations/*",
    # WebSocket handler requires full integration stack (Redis + DB + LLM)
    "backend/websocket/handler.py",
    # Utility/scripts/tests — not production code
    "backend/scripts/*",
    "backend/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
