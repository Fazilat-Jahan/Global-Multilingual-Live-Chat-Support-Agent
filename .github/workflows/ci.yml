name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: support_pass
          POSTGRES_DB: support_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_user -d support_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql+asyncpg://support_user:support_pass@localhost:5432/support_agent
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_NAME: gemini-flash-latest
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      TENANT_ID: default

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready in time" && exit 1

      - name: Create database schema
        run: python -m backend.scripts.init_db

      - name: Ingest knowledge base (for RAG retrieval tests)
        run: python -m backend.rag.ingestion

      - name: Run tests
        run: pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
