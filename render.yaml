# Render Blueprint for the backend API. Import this repo at
# https://dashboard.render.com/blueprints and Render will create the web
# service below from it. Env vars marked `sync: false` must be filled in by
# hand in the Render dashboard (never committed) — see .env.example for the
# full list and README.md's Deployment section for where each value comes
# from (Neon/Upstash/Qdrant Cloud/Gemini/SMTP/Slack).
services:
  - type: web
    name: support-agent-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      # Recipient for escalation emails (spec 17.1, Phase 7). Optional —
      # falls back to SMTP_USER if unset.
      - key: ESCALATION_EMAIL_TO
        sync: false
      # Phase 6 (spec 12.1): HMAC secret signing WebSocket session tokens.
      # REQUIRED here — APP_ENV=production above means backend/config.py's
      # validate_required_secrets() refuses to start the app without it
      # (spec 20.2). Generate via `openssl rand -hex 32` (min 32 chars).
      - key: SESSION_SECRET
        sync: false
      - key: RATE_LIMIT_PER_SESSION_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_PER_IP_PER_MINUTE
        value: "60"
      - key: TENANT_ID
        value: default
      # Phase 16 (spec 18.2): admin API key for knowledge base re-ingestion.
      - key: ADMIN_API_KEY
        sync: false
      # Phase 12 (spec 12.3): CORS / origin policy for the production backend.
      # Must list the client website domain(s) plus the widget host origin.
      - key: ALLOWED_ORIGINS
        sync: false
